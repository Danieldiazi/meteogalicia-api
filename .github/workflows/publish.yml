name: Publish to PyPI

on:
  push:
    branches: ["publish/*"]
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "setup.py"
      - "setup.cfg"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "requirements*.txt"
      - "meteogalicia_api/**"
      - "tests/**"
      - "README.md"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release or pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build and test tools
        run: python -m pip install build twine -r requirements-dev.txt .

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Check release tag matches package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one wheel")
          with ZipFile(wheels[0]) as wheel:
              metadata_file = next(
                  name for name in wheel.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              version = BytesParser().parsebytes(wheel.read(metadata_file))["Version"]
          expected = f"v{version}"
          requested = os.environ["RELEASE_TAG"].removeprefix("publish/")
          if os.environ["EVENT_NAME"] != "pull_request" and requested != expected:
              raise SystemExit(f"Release tag must be {expected}, matching pyproject.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={expected}\n")
          print(f"Validated release {expected}")
          PY

      - name: Store distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: >-
      github.repository == 'Danieldiazi/meteogalicia-api' &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/publish/')))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/meteogalicia-api/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/

      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  release:
    name: Create release after PyPI publication
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/publish/')
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

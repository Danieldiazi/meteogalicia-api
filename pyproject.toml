[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "MeteoGalicia-API"
version = "0.1.10"
description = "Python client for the MeteoGalicia weather and tide services"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
authors = [{name = "danieldiazi", email = "dandiazde@gmail.com"}]
keywords = ["MeteoGalicia"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Danieldiazi/meteogalicia-api"
Issues = "https://github.com/Danieldiazi/meteogalicia-api/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["meteogalicia_api*"]
